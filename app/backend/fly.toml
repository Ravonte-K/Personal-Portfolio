app = "ml-project-api"
primary_region = "ord"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 0

[env]
  CORS_ALLOWED_ORIGINS = "https://ml-project-web.fly.dev,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
